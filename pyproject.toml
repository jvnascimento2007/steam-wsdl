[project]
name = "steam-wsdl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "João Nascimento", email = "pessoal.jv.nascimento@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
steam-wsdl = "steam_wsdl:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
]

[tool.coverage.run]
branch = true
source = ["steam_wsdl"]
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
fail_under = 100
precision = 2
